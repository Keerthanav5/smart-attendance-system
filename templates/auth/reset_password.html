<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — RPA Smart Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:#0B1120;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:10%;left:50%;width:600px;height:600px;background:radial-gradient(circle,rgba(109,93,246,0.08) 0%,transparent 70%);transform:translateX(-50%);pointer-events:none}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;padding:44px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3),0 0 40px rgba(109,93,246,0.06);border:1px solid rgba(255,255,255,0.1);animation:fadeInUp .5s ease;position:relative;z-index:1}
.icon-wrap{width:60px;height:60px;background:linear-gradient(135deg,rgba(109,93,246,0.2),rgba(168,85,247,0.2));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:20px;border:1px solid rgba(109,93,246,0.15)}
.card h2{font-family:'Poppins',sans-serif;font-size:1.4rem;font-weight:800;color:#E2E8F0;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:.875rem;line-height:1.6;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.85rem;font-weight:600;color:#E2E8F0;margin-bottom:6px}
.input-wrap{position:relative}
.form-control{width:100%;padding:11px 14px;border:1.5px solid rgba(255,255,255,0.1);border-radius:9px;font-size:.95rem;outline:none;transition:all .25s;font-family:inherit;color:#E2E8F0;background:rgba(255,255,255,0.04)}
.form-control:focus{border-color:#6D5DF6;box-shadow:0 0 0 3px rgba(109,93,246,0.15)}
.form-control::placeholder{color:var(--muted)}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem}
.strength-wrap{margin-top:8px}
.strength-bg{height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
.strength-bar{height:100%;width:0;border-radius:99px;transition:all .3s}
.strength-label{font-size:.75rem;margin-top:4px;font-weight:600}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#6D5DF6,#A855F7);color:white;border:none;border-radius:9px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;box-shadow:0 4px 20px rgba(109,93,246,0.35)}
.btn-primary:hover{box-shadow:0 6px 30px rgba(109,93,246,0.55);transform:translateY(-2px)}
.btn-primary:disabled{opacity:.65;cursor:not-allowed;transform:none}
.error-box{display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#FCA5A5;font-size:.875rem}
.invalid-card{display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:12px;padding:28px;text-align:center}
.invalid-card .i-icon{font-size:2.5rem;margin-bottom:12px}
.invalid-card h3{color:#FCA5A5;margin-bottom:8px;font-family:'Poppins',sans-serif}
.invalid-card p{color:#FDA4AF;font-size:.875rem;line-height:1.6}
.invalid-card a{display:inline-block;margin-top:16px;color:#A78BFA;font-weight:600;font-size:.875rem;text-decoration:none;transition:color .2s}
.invalid-card a:hover{color:#C4B5FD}
.success-card{display:none;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:12px;padding:28px;text-align:center}
.success-card .s-icon{font-size:2.5rem;margin-bottom:12px}
.success-card h3{color:#4ADE80;margin-bottom:8px;font-family:'Poppins',sans-serif}
.success-card p{color:#86EFAC;font-size:.875rem;line-height:1.6}
.countdown{font-weight:700;color:#A78BFA}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.2);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div id="loadingState" class="loading">⏳ Validating link...</div>

  <div id="invalidState" class="invalid-card">
    <div class="i-icon">❌</div>
    <h3>Link Invalid or Expired</h3>
    <p id="invalidMsg">This password reset link is invalid or has expired.</p>
    <a href="/student/forgot-password/" id="retryLink">Request a New Link →</a>
  </div>

  <div id="formState" style="display:none">
    <div class="icon-wrap">🔒</div>
    <h2>Set New Password</h2>
    <p class="subtitle">Choose a strong password for your account.</p>
    <div class="error-box" id="errorBox"></div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="input-wrap">
        <input class="form-control" type="password" id="newPassword" placeholder="Min 8 characters" autofocus>
        <button class="toggle-pw" onclick="togglePw('newPassword',this)">👁</button>
      </div>
      <div class="strength-wrap">
        <div class="strength-bg"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <div class="input-wrap">
        <input class="form-control" type="password" id="confirmPassword" placeholder="Re-enter password">
        <button class="toggle-pw" onclick="togglePw('confirmPassword',this)">👁</button>
      </div>
    </div>
    <button class="btn-primary" id="resetBtn" onclick="doReset()">Set New Password</button>
  </div>

  <div id="successState" class="success-card">
    <div class="s-icon">✅</div>
    <h3>Password Updated!</h3>
    <p>Your password has been reset successfully.<br>Redirecting to login in <span class="countdown" id="countdown">3</span> seconds...</p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
let userRole = 'student';

function getCookie(n){const v=`; ${document.cookie}`,p=v.split(`; ${n}=`);if(p.length===2)return p.pop().split(';').shift();return '';}
function togglePw(id,btn){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈';}
function showError(msg){const b=document.getElementById('errorBox');b.textContent=msg;b.style.display='block';}

// Validate token on load
async function validateToken(){
  if(!token){showInvalid('No reset token found.');return;}
  try{
    const res=await fetch(`/api/auth/validate-reset-token/?token=${token}`);
    const data=await res.json();
    document.getElementById('loadingState').style.display='none';
    if(data.valid){
      userRole=data.role||'student';
      document.getElementById('formState').style.display='block';
      const retryLink=document.getElementById('retryLink');
      retryLink.href=`/${userRole}/forgot-password/`;
    } else {
      showInvalid(data.error||'Invalid or expired link.');
    }
  }catch(e){showInvalid('Could not validate link.');}
}

function showInvalid(msg){
  document.getElementById('loadingState').style.display='none';
  document.getElementById('invalidState').style.display='block';
  document.getElementById('invalidMsg').textContent=msg;
}

// Password strength
document.getElementById('newPassword')?.addEventListener('input',function(){
  const val=this.value;
  let s=0;
  if(val.length>=8)s++;
  if(/[A-Z]/.test(val))s++;
  if(/[0-9]/.test(val))s++;
  if(/[^A-Za-z0-9]/.test(val))s++;
  const cfgs=[
    {w:'0%',c:'rgba(255,255,255,0.08)',t:''},
    {w:'25%',c:'#EF4444',t:'Weak'},
    {w:'50%',c:'#F59E0B',t:'Fair'},
    {w:'75%',c:'#6D5DF6',t:'Good'},
    {w:'100%',c:'#22C55E',t:'Strong'}
  ];
  const c=cfgs[s];
  const bar=document.getElementById('strengthBar');
  const lbl=document.getElementById('strengthLabel');
  bar.style.width=c.w;bar.style.background=c.c;
  lbl.textContent=c.t;lbl.style.color=c.c;
});

async function doReset(){
  const newPassword=document.getElementById('newPassword').value.trim();
  const confirmPassword=document.getElementById('confirmPassword').value.trim();
  document.getElementById('errorBox').style.display='none';
  if(!newPassword||!confirmPassword){showError('Please fill in both fields');return;}
  if(newPassword!==confirmPassword){showError('Passwords do not match');return;}
  if(newPassword.length<8){showError('Password must be at least 8 characters');return;}
  const btn=document.getElementById('resetBtn');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Saving...';
  try{
    const res=await fetch('/api/auth/reset-password/',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
      body:JSON.stringify({token,new_password:newPassword,confirm_password:confirmPassword})
    });
    const data=await res.json();
    if(res.ok){
      document.getElementById('formState').style.display='none';
      document.getElementById('successState').style.display='block';
      let count=3;
      const interval=setInterval(()=>{
        count--;
        document.getElementById('countdown').textContent=count;
        if(count<=0){clearInterval(interval);window.location.href=`/${userRole}/login/`;}
      },1000);
    } else {
      showError(data.error||'Failed to reset password');
      btn.disabled=false;btn.innerHTML='Set New Password';
    }
  }catch(e){showError('Connection error. Try again.');btn.disabled=false;btn.innerHTML='Set New Password';}
}

validateToken();
</script>
</body>
</html>
